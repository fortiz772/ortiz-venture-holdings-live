    <script type="text/babel">
      const { useState, useEffect, useMemo, useRef, useCallback } = React;
      const MotionLib = window.Motion || window.FramerMotion || {};
      const { motion, AnimatePresence } = MotionLib;

      const STORAGE_KEYS = {
        events: "chronova.events.v1",
        reminded: "chronova.reminded.v1",
        goals: "chronova.goals.v1",
        tasks: "chronova.tasks.v1",
        notes: "chronova.notes.v1",
        weather: "chronova.weather.v1"
      };

      const CATEGORIES = [
        { id: "work", label: "Work", swatch: "#0EA5E9", strong: "#0369A1", soft: "#E0F2FE", text: "#0369A1" },
        { id: "personal", label: "Personal", swatch: "#10B981", strong: "#047857", soft: "#D1FAE5", text: "#047857" },
        { id: "health", label: "Health", swatch: "#F43F5E", strong: "#BE123C", soft: "#FFE4E6", text: "#BE123C" },
        { id: "travel", label: "Travel", swatch: "#F59E0B", strong: "#B45309", soft: "#FEF3C7", text: "#B45309" },
        { id: "other", label: "Other", swatch: "#8B5CF6", strong: "#6D28D9", soft: "#EDE9FE", text: "#6D28D9" }
      ];
      const CATEGORY_MAP = CATEGORIES.reduce((acc, c) => { acc[c.id] = c; return acc; }, {});

      const REMINDER_OPTIONS = [
        { value: "", label: "No reminder" },
        { value: "0", label: "At start time" },
        { value: "5", label: "5 minutes before" },
        { value: "15", label: "15 minutes before" },
        { value: "30", label: "30 minutes before" },
        { value: "60", label: "1 hour before" },
        { value: "1440", label: "1 day before" }
      ];

      const WEEKDAY_SHORT = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      const WEEKDAY_LONG = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      const MONTH_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      const HOURS = Array.from({ length: 24 }, (_, i) => i);

      function pad2(n) { return n < 10 ? "0" + n : "" + n; }
      function toKey(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
      function fromKey(k) { const p = k.split("-"); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); }
      function isSameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
      function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
      function addMonths(d, n) { const r = new Date(d); r.setMonth(r.getMonth() + n); return r; }
      function startOfWeek(d) { const r = new Date(d); r.setHours(0, 0, 0, 0); r.setDate(r.getDate() - r.getDay()); return r; }
      function startOfDay(d) { const r = new Date(d); r.setHours(0, 0, 0, 0); return r; }

      function getMonthMatrix(anchor) {
        const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
        const last = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 0);
        const gridStart = startOfWeek(first);
        const gridEnd = startOfWeek(last);
        const weeks = [];
        let cursor = new Date(gridStart);
        while (cursor <= gridEnd) {
          const week = [];
          for (let i = 0; i < 7; i++) { week.push(new Date(cursor)); cursor = addDays(cursor, 1); }
          weeks.push(week);
        }
        return weeks;
      }
      function getWeekDays(anchor) {
        const start = startOfWeek(anchor);
        const days = [];
        for (let i = 0; i < 7; i++) days.push(addDays(start, i));
        return days;
      }
      function timeToMinutes(t) { if (!t) return 0; const p = t.split(":"); return Number(p[0]) * 60 + Number(p[1]); }
      function minutesToTimeLabel(mins) {
        let h = Math.floor(mins / 60);
        const m = mins % 60;
        const ampm = h >= 12 ? "PM" : "AM";
        h = h % 12; if (h === 0) h = 12;
        return h + (m ? ":" + pad2(m) : "") + " " + ampm;
      }
      function minutesToTimeStr(mins) {
        const clamped = ((mins % 1440) + 1440) % 1440;
        return pad2(Math.floor(clamped / 60)) + ":" + pad2(clamped % 60);
      }
      function formatTimeLabel(t) { if (!t) return ""; return minutesToTimeLabel(timeToMinutes(t)); }
      function formatMonthYear(d) { return MONTH_LONG[d.getMonth()] + " " + d.getFullYear(); }
      function formatDayHeader(d) { return WEEKDAY_LONG[d.getDay()] + ", " + MONTH_LONG[d.getMonth()] + " " + d.getDate(); }
      function formatShortDate(d) { return MONTH_LONG[d.getMonth()].slice(0, 3) + " " + d.getDate(); }
      function relativeDateLabel(d) {
        const diffDays = Math.round((startOfDay(d) - startOfDay(new Date())) / 86400000);
        if (diffDays === 0) return "Today";
        if (diffDays === 1) return "Tomorrow";
        if (diffDays === -1) return "Yesterday";
        return formatShortDate(d);
      }
      function agendaHeaderLabel(d) {
        const rel = relativeDateLabel(d);
        const full = formatDayHeader(d);
        return (rel === "Today" || rel === "Tomorrow" || rel === "Yesterday") ? rel + " · " + full : full;
      }
      function greeting() {
        const h = new Date().getHours();
        if (h < 12) return "Good morning";
        if (h < 18) return "Good afternoon";
        return "Good evening";
      }
      function uid() { return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }
      function eventEndKey(ev) { return ev.endDate || ev.date; }

      function buildEventsByDayMap(list) {
        const map = {};
        list.forEach(ev => {
          const start = fromKey(ev.date);
          const end = fromKey(eventEndKey(ev));
          let cursor = new Date(start);
          let guard = 0;
          while (cursor <= end && guard < 60) {
            const key = toKey(cursor);
            if (!map[key]) map[key] = [];
            map[key].push(ev);
            cursor = addDays(cursor, 1);
            guard++;
          }
        });
        Object.keys(map).forEach(key => {
          map[key].sort((a, b) => {
            if (a.allDay && !b.allDay) return -1;
            if (!a.allDay && b.allDay) return 1;
            return timeToMinutes(a.startTime) - timeToMinutes(b.startTime);
          });
        });
        return map;
      }

      function computeUpcoming(list, limit) {
        const now = new Date();
        return list
          .filter(ev => {
            const end = fromKey(eventEndKey(ev));
            if (!ev.allDay && ev.endTime) {
              const parts = ev.endTime.split(":").map(Number);
              end.setHours(parts[0], parts[1], 0, 0);
            } else {
              end.setHours(23, 59, 59, 999);
            }
            return end >= now;
          })
          .sort((a, b) => {
            const diff = fromKey(a.date) - fromKey(b.date);
            if (diff !== 0) return diff;
            return timeToMinutes(a.startTime) - timeToMinutes(b.startTime);
          })
          .slice(0, limit);
      }

      function findFocusWindow(dayEvents) {
        const timed = dayEvents
          .filter(ev => !ev.allDay)
          .map(ev => ({ start: timeToMinutes(ev.startTime), end: Math.max(timeToMinutes(ev.endTime || ev.startTime), timeToMinutes(ev.startTime) + 15) }))
          .sort((a, b) => a.start - b.start);
        const dayStart = 8 * 60, dayEnd = 19 * 60;
        let cursor = dayStart;
        let best = null;
        timed.forEach(ev => {
          if (ev.start > cursor) {
            const gap = ev.start - cursor;
            if (!best || gap > (best.end - best.start)) best = { start: cursor, end: ev.start };
          }
          cursor = Math.max(cursor, ev.end);
        });
        if (cursor < dayEnd) {
          const gap = dayEnd - cursor;
          if (!best || gap > (best.end - best.start)) best = { start: cursor, end: dayEnd };
        }
        if (!best || (best.end - best.start) < 30) return null;
        return best;
      }

      function computeInsight(todayEvents, goals, tasks) {
        const timed = todayEvents.length;
        const openTasks = tasks.filter(t => !t.done).length;
        const parts = [];
        if (timed > 0) {
          const next = todayEvents[0];
          parts.push(timed + (timed === 1 ? " thing" : " things") + " on today, starting with " + next.title + (next.allDay ? "" : " at " + formatTimeLabel(next.startTime)) + ".");
        } else {
          parts.push("Nothing on your calendar today — a clear runway.");
        }
        if (openTasks > 0) parts.push(openTasks + " open " + (openTasks === 1 ? "task" : "tasks") + ".");
        const activeGoals = goals.filter(g => g.progress < 100).sort((a, b) => b.progress - a.progress);
        if (activeGoals[0]) parts.push("\u201c" + activeGoals[0].title + "\u201d is " + activeGoals[0].progress + "% there.");
        return parts.join(" ");
      }

      function buildSeedEvents() {
        const today = startOfDay(new Date());
        const k = (offset) => toKey(addDays(today, offset));
        return [
          { id: uid(), title: "Welcome to Chronova AI", date: k(0), endDate: k(0), allDay: false, startTime: "09:00", endTime: "09:30", category: "work", location: "", notes: "Tap any day or time slot to add your own event, or tap an event to edit it.", reminder: "" },
          { id: uid(), title: "Product strategy sync", date: k(0), endDate: k(0), allDay: false, startTime: "13:00", endTime: "14:00", category: "work", location: "Conference Room A", notes: "Review the Q3 roadmap.", reminder: "15" },
          { id: uid(), title: "Design review", date: k(0), endDate: k(0), allDay: false, startTime: "13:30", endTime: "14:15", category: "other", location: "", notes: "", reminder: "" },
          { id: uid(), title: "Morning run", date: k(1), endDate: k(1), allDay: false, startTime: "07:00", endTime: "07:45", category: "health", location: "Riverside Park", notes: "", reminder: "" },
          { id: uid(), title: "Dentist appointment", date: k(2), endDate: k(2), allDay: false, startTime: "11:00", endTime: "12:00", category: "health", location: "Bright Smile Dental", notes: "", reminder: "60" },
          { id: uid(), title: "1:1 with manager", date: k(3), endDate: k(3), allDay: false, startTime: "13:30", endTime: "14:00", category: "work", location: "", notes: "", reminder: "5" },
          { id: uid(), title: "Yoga class", date: k(3), endDate: k(3), allDay: false, startTime: "18:30", endTime: "19:30", category: "health", location: "Studio Flow", notes: "", reminder: "30" },
          { id: uid(), title: "Flight to Austin", date: k(4), endDate: k(4), allDay: false, startTime: "08:30", endTime: "11:00", category: "travel", location: "JFK Airport", notes: "Gate opens 45 minutes before departure.", reminder: "60" },
          { id: uid(), title: "Team offsite", date: k(5), endDate: k(6), allDay: true, startTime: null, endTime: null, category: "work", location: "Lake House Retreat", notes: "Bring a laptop and comfortable shoes.", reminder: "" },
          { id: uid(), title: "Mom's birthday", date: k(9), endDate: k(9), allDay: true, startTime: null, endTime: null, category: "personal", location: "", notes: "Order flowers.", reminder: "1440" },
          { id: uid(), title: "Grocery run", date: k(-1), endDate: k(-1), allDay: false, startTime: "18:00", endTime: "18:30", category: "personal", location: "Whole Foods", notes: "", reminder: "" }
        ];
      }
      function buildSeedGoals() {
        return [
          { id: uid(), title: "Ship Chronova v2", target: "Launch", category: "work", progress: 68, createdAt: Date.now() },
          { id: uid(), title: "Read 12 books this year", target: "12 books", category: "personal", progress: 41, createdAt: Date.now() },
          { id: uid(), title: "Run a half marathon", target: "13.1 miles", category: "health", progress: 25, createdAt: Date.now() }
        ];
      }
      function buildSeedTasks() {
        return [
          { id: uid(), title: "Reply to Ledge follow-up", done: false, createdAt: Date.now() },
          { id: uid(), title: "Pack for the Austin trip", done: false, createdAt: Date.now() },
          { id: uid(), title: "Send the Q3 roadmap doc", done: true, createdAt: Date.now() }
        ];
      }
      function buildSeedNotes() {
        return [
          { id: uid(), text: "West Middle wants a demo before the 15th \u2014 loop in Sam.", createdAt: Date.now() - 86400000 },
          { id: uid(), text: "Ledge terminal rollout: confirm pricing tier before Friday's call.", createdAt: Date.now() }
        ];
      }

      function useLocalStorage(key, initial) {
        const [value, setValue] = useState(() => {
          try {
            const raw = window.localStorage.getItem(key);
            if (raw) return JSON.parse(raw);
          } catch (err) {}
          return typeof initial === "function" ? initial() : initial;
        });
        useEffect(() => {
          try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (err) {}
        }, [key, value]);
        return [value, setValue];
      }

      const WEATHER_CODE_MAP = {
        0: { label: "Clear sky", icon: "sun" }, 1: { label: "Mostly clear", icon: "sun" },
        2: { label: "Partly cloudy", icon: "cloud-sun" }, 3: { label: "Overcast", icon: "cloud" },
        45: { label: "Foggy", icon: "cloud" }, 48: { label: "Foggy", icon: "cloud" },
        51: { label: "Light drizzle", icon: "rain" }, 53: { label: "Drizzle", icon: "rain" }, 55: { label: "Dense drizzle", icon: "rain" },
        61: { label: "Light rain", icon: "rain" }, 63: { label: "Rain", icon: "rain" }, 65: { label: "Heavy rain", icon: "rain" },
        71: { label: "Light snow", icon: "snow" }, 73: { label: "Snow", icon: "snow" }, 75: { label: "Heavy snow", icon: "snow" },
        80: { label: "Rain showers", icon: "rain" }, 81: { label: "Rain showers", icon: "rain" }, 82: { label: "Violent showers", icon: "rain" },
        95: { label: "Thunderstorm", icon: "storm" }, 96: { label: "Thunderstorm", icon: "storm" }, 99: { label: "Thunderstorm", icon: "storm" }
      };
      function describeWeather(code) { return WEATHER_CODE_MAP[code] || { label: "Weather", icon: "cloud" }; }

      function useWeather() {
        const [state, setState] = useState(() => {
          try {
            const raw = window.localStorage.getItem(STORAGE_KEYS.weather);
            if (raw) {
              const cached = JSON.parse(raw);
              if (Date.now() - cached.fetchedAt < 45 * 60000) return { status: "ready", data: cached };
            }
          } catch (err) {}
          return { status: "idle" };
        });

        const load = useCallback(() => {
          if (!navigator.geolocation) { setState({ status: "error", message: "Location isn't available in this browser." }); return; }
          setState({ status: "loading" });
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const { latitude, longitude } = pos.coords;
              const wxUrl = "https://api.open-meteo.com/v1/forecast?latitude=" + latitude + "&longitude=" + longitude +
                "&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=auto&forecast_days=1";
              const placeUrl = "https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=" + latitude + "&longitude=" + longitude + "&localityLanguage=en";
              Promise.all([
                fetch(wxUrl).then(r => r.ok ? r.json() : Promise.reject(new Error("weather"))),
                fetch(placeUrl).then(r => r.ok ? r.json() : null).catch(() => null)
              ]).then(([wx, place]) => {
                const placeLabel = place ? [place.city || place.locality, place.principalSubdivision].filter(Boolean).join(", ") : "";
                const data = {
                  place: placeLabel || "Your location",
                  temp: Math.round(wx.current.temperature_2m),
                  code: wx.current.weather_code,
                  high: Math.round(wx.daily.temperature_2m_max[0]),
                  low: Math.round(wx.daily.temperature_2m_min[0]),
                  precip: wx.daily.precipitation_probability_max[0],
                  fetchedAt: Date.now()

        const parts = timeStr.split(":").map(Number);
        d.setHours(parts[0], parts[1], 0, 0);

        } else {

        }
        return [

      function layoutTimedEvents(events) {
        const sorted = [...events].sort((a, b) => timeToMinutes(a.startTime) - timeToMinutes(b.startTime));
        const clusters = [];
        let current = [];
        let currentEnd = -1;
        sorted.forEach(ev => {
          const start = timeToMinutes(ev.startTime);
          const end = Math.max(timeToMinutes(ev.endTime || ev.startTime), start + 15);
          if (current.length && start >= currentEnd) {
            clusters.push(current);
            current = [];
            currentEnd = -1;
          }
          current.push({ ev, start, end });
          currentEnd = Math.max(currentEnd, end);
        });
        if (current.length) clusters.push(current);

        const placed = [];
        clusters.forEach(cluster => {
          const colEnds = [];
          const withCols = cluster.map(item => {
            let col = colEnds.findIndex(end => end <= item.start);
            if (col === -1) { col = colEnds.length; colEnds.push(item.end); }
            else colEnds[col] = item.end;
            return { ...item, col };
          });
          const colCount = colEnds.length;
          withCols.forEach(item => placed.push({ ...item, colCount }));
        });
        return placed;
      }

      function BreathingModal({ onClose }) {
        const [patternId, setPatternId] = useState("4-4-6");
        const [running, setRunning] = useState(false);
        const [phase, setPhase] = useState("inhale");
        const timeoutRef = useRef(null);
        const pattern = BREATH_PATTERNS.find(p => p.id === patternId);
        const phases = pattern.hold2 ? ["inhale", "hold", "exhale", "hold2"] : ["inhale", "hold", "exhale"];

        useEffect(() => {
          if (!running) return;
          let idx = phases.indexOf(phase);
          if (idx === -1) idx = 0;
          function step() {
            const current = phases[idx];
            setPhase(current);
            const secs = pattern[current] || 4;
            timeoutRef.current = setTimeout(() => {
              idx = (idx + 1) % phases.length;
              step();
            }, secs * 1000);
          }
          step();
          return () => { if (timeoutRef.current) clearTimeout(timeoutRef.current); };
        }, [running, patternId]);

        function selectPattern(id) { setPatternId(id); setRunning(false); setPhase("inhale"); }

        const scale = (phase === "inhale" || phase === "hold") ? 1.35 : 0.85;
        const duration = pattern[phase] || pattern.hold || 4;
        const phaseLabel = phase === "inhale" ? "Inhale" : phase === "exhale" ? "Exhale" : "Hold";

        return (
          <motion.div className="absolute inset-0 z-40 flex flex-col bg-white" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}>

                <span className="text-lg font-black text-white">{running ? phaseLabel : "Ready"}</span>

              <p className="mt-1 text-xs font-semibold text-slate-400">Inhale · hold · exhale</p>

        );

      function InsightsScreen({ insight, focusWindow, weekStats, events, goals, onEventClick }) {

          return events.filter(ev => (ev.title || "").toLowerCase().indexOf(q) !== -1 || (ev.notes || "").toLowerCase().indexOf(q) !== -1 || (ev.location || "").toLowerCase().indexOf(q) !== -1).slice(0, 8);
        }, [query, events]);
        const activeGoals = goals.filter(g => g.progress < 100).slice(0, 4);

          <div className="space-y-4">

      function App() {
        const [events, setEvents] = useLocalStorage(STORAGE_KEYS.events, buildSeedEvents);
        const [remindedIds, setRemindedIds] = useLocalStorage(STORAGE_KEYS.reminded, []);
        const [goals, setGoals] = useLocalStorage(STORAGE_KEYS.goals, buildSeedGoals);
        const [tasks, setTasks] = useLocalStorage(STORAGE_KEYS.tasks, buildSeedTasks);
        const [notes, setNotes] = useLocalStorage(STORAGE_KEYS.notes, buildSeedNotes);
        const [tab, setTab] = useState("home");
        const [view, setView] = useState("month");
        const [anchor, setAnchor] = useState(() => startOfDay(new Date()));
        const [direction, setDirection] = useState(1);
        const [selectedDayKey, setSelectedDayKey] = useState(() => toKey(new Date()));
        const [modal, setModal] = useState(null);
        const [goalModal, setGoalModal] = useState(null);
        const [breathingOpen, setBreathingOpen] = useState(false);
        const [confirmDeleteId, setConfirmDeleteId] = useState(null);
        const [confirmDeleteGoalId, setConfirmDeleteGoalId] = useState(null);
        const [search, setSearch] = useState("");
        const [searchOpen, setSearchOpen] = useState(false);
        const [activeCategories, setActiveCategories] = useState(() => CATEGORIES.map(c => c.id));
        const [filtersOpen, setFiltersOpen] = useState(false);
        const [noteInput, setNoteInput] = useState("");
        const [toasts, setToasts] = useState([]);
        const searchInputRef = useRef(null);
        const todayKey = toKey(new Date());
        const weather = useWeather();

        const pushToast = useCallback((message, tone) => {
          const id = uid();
          setToasts(t => [...t, { id, message, tone: tone || "default" }]);
          setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3800);
        }, []);

        const visibleEvents = useMemo(() => {
          const q = search.trim().toLowerCase();
          return events.filter(ev => {
            if (activeCategories.indexOf(ev.category) === -1) return false;
            if (!q) return true;
            return (ev.title || "").toLowerCase().indexOf(q) !== -1 ||
                   (ev.location || "").toLowerCase().indexOf(q) !== -1 ||
                   (ev.notes || "").toLowerCase().indexOf(q) !== -1;
          });
        }, [events, activeCategories, search]);

        const eventsByDay = useMemo(() => buildEventsByDayMap(visibleEvents), [visibleEvents]);
        const eventsByDayAll = useMemo(() => buildEventsByDayMap(events), [events]);

        const categoryCounts = useMemo(() => {
          const counts = {};
          CATEGORIES.forEach(c => counts[c.id] = 0);
          events.forEach(ev => { counts[ev.category] = (counts[ev.category] || 0) + 1; });
          return counts;
        }, [events]);

        const todaysEventsAll = eventsByDayAll[todayKey] || [];
        const focusWindow = useMemo(() => findFocusWindow(todaysEventsAll), [todaysEventsAll]);
        const insightText = useMemo(() => computeInsight(todaysEventsAll, goals, tasks), [todaysEventsAll, goals, tasks]);
        const homeUpcoming = useMemo(() => computeUpcoming(events, 5), [events]);
        const workUpcoming = useMemo(() => computeUpcoming(events.filter(e => e.category === "work"), 8), [events]);
        const weekStats = useMemo(() => {
          const start = startOfWeek(new Date());
          const end = addDays(start, 6);
          const counts = {};
          let total = 0;
          events.forEach(ev => {
            const d = fromKey(ev.date);
            if (d >= start && d <= end) {
              total++;
              const key = toKey(d);
              counts[key] = (counts[key] || 0) + 1;
            }
          });
          let busiestKey = null, busiestCount = 0;
          Object.keys(counts).forEach(k => { if (counts[k] > busiestCount) { busiestCount = counts[k]; busiestKey = k; } });
          return {
            eventCount: total,
            busiestLabel: busiestKey ? WEEKDAY_SHORT[fromKey(busiestKey).getDay()] : "—",
            openTasks: tasks.filter(t => !t.done).length
          };
        }, [events, tasks]);

        function navigate(step) {
          setDirection(step);
          setAnchor(prev => {
            if (view === "month") return addMonths(prev, step);
            if (view === "week") return addDays(prev, 7 * step);
            if (view === "day") return addDays(prev, step);
            return addMonths(prev, step);
          });
        }
        function goToday() {
          setDirection(0);
          const t = startOfDay(new Date());
          setAnchor(t);
          setSelectedDayKey(toKey(t));
        }
        function selectDay(key) {
          setSelectedDayKey(key);
          const d = fromKey(key);
          if (d.getMonth() !== anchor.getMonth() || d.getFullYear() !== anchor.getFullYear()) {
            setAnchor(startOfDay(d));
          }
        }

        function openCreate(dateKey, startTime) {
          const st = startTime || "09:00";
          setModal({
            mode: "create",
            draft: {
              id: null,
              title: "",
              date: dateKey || selectedDayKey,
              endDate: dateKey || selectedDayKey,
              allDay: false,
              startTime: st,
              endTime: minutesToTimeStr(timeToMinutes(st) + 60),
              category: "work",
              location: "",
              notes: "",
              reminder: ""
            }
          });
        }
        function openEdit(ev) { setModal({ mode: "edit", draft: { ...ev } }); }
        function closeModal() { setModal(null); }

        function saveEvent(draft) {
          if (!draft.title.trim()) return;
          const endDate = draft.allDay ? (draft.endDate && draft.endDate >= draft.date ? draft.endDate : draft.date) : draft.date;
          const startTime = draft.allDay ? null : (draft.startTime || "09:00");
          let endTime = draft.allDay ? null : (draft.endTime || "10:00");
          if (!draft.allDay && timeToMinutes(endTime) <= timeToMinutes(startTime)) {
            endTime = minutesToTimeStr(timeToMinutes(startTime) + 30);
          }
          const clean = { ...draft, title: draft.title.trim(), endDate, startTime, endTime };
          if (draft.id) {
            setEvents(list => list.map(e => e.id === draft.id ? { ...clean, id: draft.id } : e));
            pushToast("Event updated");
          } else {
            setEvents(list => [...list, { ...clean, id: uid() }]);
            pushToast("Event created");
          }
          setModal(null);
        }
        function requestDelete(id) { setConfirmDeleteId(id); }
        function confirmDelete() {
          setEvents(list => list.filter(e => e.id !== confirmDeleteId));
          setConfirmDeleteId(null);
          setModal(null);
          pushToast("Event deleted");
        }
        function toggleCategory(id) {
          setActiveCategories(list => list.indexOf(id) === -1 ? [...list, id] : list.filter(x => x !== id));
        }
        function resetDemo() {
          setEvents(buildSeedEvents());
          setGoals(buildSeedGoals());
          setTasks(buildSeedTasks());
          setNotes(buildSeedNotes());
          setRemindedIds([]);
          pushToast("Demo data reset");
        }
        function exportAll() {
          if (!events.length) { pushToast("No events to export"); return; }
          downloadText("chronova-calendar.ics", buildICS(events), "text/calendar");
          pushToast("Calendar exported");
        }
        function handlePickDate(key) {
          selectDay(key);
          setTab("calendar");
          setFiltersOpen(false);
        }
        function openSearchFromAnywhere() {
          setTab("calendar");
          setView("agenda");
          setSearchOpen(true);
        }

        function toggleTask(id) { setTasks(list => list.map(t => t.id === id ? { ...t, done: !t.done } : t)); }
        function addTask(title) { setTasks(list => [...list, { id: uid(), title, done: false, createdAt: Date.now() }]); }

        function openNewGoal() { setGoalModal({ id: null, title: "", target: "", category: "work", progress: 0 }); }
        function openEditGoal(g) { setGoalModal({ ...g }); }
        function closeGoalModal() { setGoalModal(null); }
        function saveGoal(draft) {
          if (!draft.title.trim()) return;
          const clean = { ...draft, title: draft.title.trim() };
          if (draft.id) {
            setGoals(list => list.map(g => g.id === draft.id ? clean : g));
            pushToast("Goal updated");
          } else {
            setGoals(list => [...list, { ...clean, id: uid(), createdAt: Date.now() }]);
            pushToast("Goal added");
          }
          setGoalModal(null);
        }
        function requestDeleteGoal(id) { setConfirmDeleteGoalId(id); }
        function confirmDeleteGoal() {
          setGoals(list => list.filter(g => g.id !== confirmDeleteGoalId));
          setConfirmDeleteGoalId(null);
          setGoalModal(null);
          pushToast("Goal deleted");
        }

        function submitNote(e) {
          e.preventDefault();
          if (!noteInput.trim()) return;
          setNotes(list => [{ id: uid(), text: noteInput.trim(), createdAt: Date.now() }, ...list]);
          setNoteInput("");
        }
        function deleteNote(id) { setNotes(list => list.filter(n => n.id !== id)); }

        useEffect(() => {
          function check() {
            const now = new Date();
            events.forEach(ev => {
              if (ev.reminder === "" || ev.reminder == null || ev.allDay) return;
              const target = fromKey(ev.date);
              const parts = (ev.startTime || "00:00").split(":").map(Number);
              target.setHours(parts[0], parts[1], 0, 0);
              target.setMinutes(target.getMinutes() - Number(ev.reminder));
              const diff = now - target;
              const fireKey = ev.id + ":" + target.getTime();
              if (diff >= 0 && diff < 20000 && remindedIds.indexOf(fireKey) === -1) {
                pushToast("Reminder: " + ev.title + " at " + formatTimeLabel(ev.startTime), "reminder");
                setRemindedIds(list => [...list.slice(-200), fireKey]);
              }
            });
          }
          const interval = setInterval(check, 15000);
          return () => clearInterval(interval);
        }, [events, remindedIds, pushToast, setRemindedIds]);

        useEffect(() => {
          if (searchOpen && searchInputRef.current) searchInputRef.current.focus();
        }, [searchOpen]);

        useEffect(() => {
          function onKeyDown(e) {
            const tag = (e.target.tagName || "").toLowerCase();
            if (tag === "input" || tag === "textarea" || tag === "select") {
              if (e.key === "Escape") e.target.blur();
              return;
            }
            if (modal || goalModal || confirmDeleteId || confirmDeleteGoalId || filtersOpen || breathingOpen) {
              if (e.key === "Escape") {
                setModal(null); setGoalModal(null); setConfirmDeleteId(null);
                setConfirmDeleteGoalId(null); setFiltersOpen(false); setBreathingOpen(false);
              }
              return;
            }
            if (e.key === "Escape" && searchOpen) { setSearchOpen(false); setSearch(""); return; }
            if (e.key === "t" || e.key === "T") goToday();
            else if (e.key === "n" || e.key === "N") openCreate(selectedDayKey);
            else if (e.key === "ArrowLeft") navigate(-1);
            else if (e.key === "ArrowRight") navigate(1);
            else if (e.key === "/") { e.preventDefault(); openSearchFromAnywhere(); }
            else if (e.key === "1") setView("month");
            else if (e.key === "2") setView("week");
            else if (e.key === "3") setView("day");
            else if (e.key === "4") setView("agenda");
          }
          document.addEventListener("keydown", onKeyDown);
          return () => document.removeEventListener("keydown", onKeyDown);
        }, [modal, goalModal, confirmDeleteId, confirmDeleteGoalId, filtersOpen, breathingOpen, searchOpen, anchor, view, selectedDayKey]);

        function periodLabel() {
          if (view === "month") return formatMonthYear(anchor);
          if (view === "week") {
            const days = getWeekDays(anchor);
            const start = days[0], end = days[6];
            if (start.getMonth() === end.getMonth()) return MONTH_LONG[start.getMonth()] + " " + start.getDate() + "–" + end.getDate() + ", " + end.getFullYear();
            return formatShortDate(start) + " – " + formatShortDate(end) + ", " + end.getFullYear();
          }
          if (view === "day") return formatDayHeader(anchor);
          return "Agenda";
        }

        const fabBottomOffset = "calc(64px + 0.75rem + env(safe-area-inset-bottom))";

        return (
          <div className="phone-stage">
            <div className="phone-body">
              <div className="phone-notch"></div>

              <div className="phone-screen cal-scroll">
                <div className="sticky top-0 z-30 shrink-0 bg-white/95 backdrop-blur-xl" style={{ paddingTop: "env(safe-area-inset-top)" }}>
                  <Header
                    tab={tab}
                    periodLabel={periodLabel()} onPrev={() => navigate(-1)} onNext={() => navigate(1)} onToday={goToday}
                    onOpenFilters={() => setFiltersOpen(true)}
                    searchOpen={searchOpen} setSearchOpen={setSearchOpen}
                    search={search} setSearch={setSearch} searchInputRef={searchInputRef}
                    onSearchIconClick={openSearchFromAnywhere}
                  />
                  {tab === "calendar" && !searchOpen && <ViewTabs view={view} setView={setView} />}
                </div>

                <main className="flex-1 px-4 pb-28 pt-3">
                  <AnimatePresence mode="wait">
                    <motion.div key={tab + (tab === "calendar" ? view : "")} initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} transition={{ duration: .16 }}>
                      {tab === "home" && (
                        <HomeScreen
                          todayEvents={todaysEventsAll} insight={insightText} focusWindow={focusWindow} weather={weather}
                          goals={goals} tasks={tasks} onToggleTask={toggleTask} onAddTask={addTask}
                          upcoming={homeUpcoming} onEventClick={openEdit} onOpenBreathing={() => setBreathingOpen(true)}
                          onOpenGoal={openEditGoal} onGoTab={setTab}
                        />
                      )}
                      {tab === "calendar" && (
                        <>
                          {view === "month" && (
                            <MonthView anchor={anchor} direction={direction} eventsByDay={eventsByDay} todayKey={todayKey} selectedKey={selectedDayKey} onSelectDay={selectDay} onEventClick={openEdit} onAddForDay={(key) => openCreate(key)} />
                          )}
                          {view === "week" && (
                            <TimeGridView days={getWeekDays(anchor)} eventsByDay={eventsByDay} todayKey={todayKey} onSlotClick={(key, time) => openCreate(key, time)} onEventClick={openEdit} direction={direction} viewKey={"week-" + toKey(anchor)} />
                          )}
                          {view === "day" && (
                            <TimeGridView days={[anchor]} eventsByDay={eventsByDay} todayKey={todayKey} onSlotClick={(key, time) => openCreate(key, time)} onEventClick={openEdit} direction={direction} viewKey={"day-" + toKey(anchor)} />
                          )}
                          {view === "agenda" && (
                            <AgendaView events={visibleEvents} todayKey={todayKey} onEventClick={openEdit} />
                          )}
                        </>
                      )}
                      {tab === "insights" && (
                        <InsightsScreen insight={insightText} focusWindow={focusWindow} weekStats={weekStats} events={events} goals={goals} onEventClick={openEdit} />
                      )}
                      {tab === "goals" && (
                        <GoalsScreen goals={goals} onOpenGoal={openEditGoal} onNewGoal={openNewGoal} />
                      )}
                      {tab === "business" && (
                        <BusinessScreen workEvents={workUpcoming} notes={notes} noteInput={noteInput} setNoteInput={setNoteInput} onAddNote={submitNote} onDeleteNote={deleteNote} onEventClick={openEdit} />
                      )}
                    </motion.div>
                  </AnimatePresence>
                </main>
              </div>

              <BottomTabBar tab={tab} setTab={setTab} />

              {(tab === "home" || tab === "calendar") && <FAB onClick={() => openCreate(selectedDayKey)} bottomOffset={fabBottomOffset} />}
              {tab === "goals" && <FAB onClick={openNewGoal} bottomOffset={fabBottomOffset} />}

              <div className="phone-home-indicator"></div>

              <FiltersSheet
                open={filtersOpen} onClose={() => setFiltersOpen(false)}
                anchor={anchor} todayKey={todayKey} selectedKey={selectedDayKey}
                onSelectDate={handlePickDate}
                onMonthShift={(step) => setAnchor(a => addMonths(a, step))}
                activeCategories={activeCategories} onToggleCategory={toggleCategory} categoryCounts={categoryCounts}
                onExport={exportAll} onReset={resetDemo}
              />

              <AnimatePresence>
                {breathingOpen && <BreathingModal onClose={() => setBreathingOpen(false)} />}
              </AnimatePresence>

              <AnimatePresence>
                {modal && (
                  <EventModal
                    draft={modal.draft}
                    onChange={(next) => setModal({ ...modal, draft: next })}
                    onClose={closeModal}
                    onSave={saveEvent}
                    onDelete={requestDelete}
                  />
                )}
              </AnimatePresence>

              <AnimatePresence>
                {goalModal && (
                  <GoalModal
                    draft={goalModal}
                    onChange={setGoalModal}
                    onClose={closeGoalModal}
                    onSave={saveGoal}
                    onDelete={requestDeleteGoal}
                  />
                )}
              </AnimatePresence>

              <AnimatePresence>
                {confirmDeleteId && <ConfirmDialog onCancel={() => setConfirmDeleteId(null)} onConfirm={confirmDelete} />}
              </AnimatePresence>

              <AnimatePresence>
                {confirmDeleteGoalId && <ConfirmDialog onCancel={() => setConfirmDeleteGoalId(null)} onConfirm={confirmDeleteGoal} />}
              </AnimatePresence>

              <ToastStack toasts={toasts} />
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
