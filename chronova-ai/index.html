      const { useState, useEffect, useMemo, useRef, useCallback } = React;

      const HOURS = Array.from({ length: 24 }, (_, i) => i);

      function pad2(n) { return n < 10 ? "0" + n : "" + n; }
      function toKey(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
      function fromKey(k) { const p = k.split("-"); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); }
      function isSameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
      function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
      function addMonths(d, n) { const r = new Date(d); r.setMonth(r.getMonth() + n); return r; }
      function startOfWeek(d) { const r = new Date(d); r.setHours(0, 0, 0, 0); r.setDate(r.getDate() - r.getDay()); return r; }
      function startOfDay(d) { const r = new Date(d); r.setHours(0, 0, 0, 0); return r; }

      function getMonthMatrix(anchor) {
        const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
        const last = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 0);
        const gridStart = startOfWeek(first);
        const gridEnd = startOfWeek(last);
        const weeks = [];
        let cursor = new Date(gridStart);
        while (cursor <= gridEnd) {
          const week = [];
          for (let i = 0; i < 7; i++) { week.push(new Date(cursor)); cursor = addDays(cursor, 1); }
          weeks.push(week);
        }
        return weeks;
      }
      function getWeekDays(anchor) {
        const start = startOfWeek(anchor);
        const days = [];
        for (let i = 0; i < 7; i++) days.push(addDays(start, i));
        return days;
      }
      function timeToMinutes(t) { if (!t) return 0; const p = t.split(":"); return Number(p[0]) * 60 + Number(p[1]); }
      function minutesToTimeLabel(mins) {
        let h = Math.floor(mins / 60);
        const m = mins % 60;
        const ampm = h >= 12 ? "PM" : "AM";
        h = h % 12; if (h === 0) h = 12;
        return h + (m ? ":" + pad2(m) : "") + " " + ampm;
      }
      function minutesToTimeStr(mins) {
        const clamped = ((mins % 1440) + 1440) % 1440;
        return pad2(Math.floor(clamped / 60)) + ":" + pad2(clamped % 60);
      }
      function formatTimeLabel(t) { if (!t) return ""; return minutesToTimeLabel(timeToMinutes(t)); }
      function formatMonthYear(d) { return MONTH_LONG[d.getMonth()] + " " + d.getFullYear(); }
      function formatDayHeader(d) { return WEEKDAY_LONG[d.getDay()] + ", " + MONTH_LONG[d.getMonth()] + " " + d.getDate(); }
      function formatShortDate(d) { return MONTH_LONG[d.getMonth()].slice(0, 3) + " " + d.getDate(); }
      function relativeDateLabel(d) {
        const diffDays = Math.round((startOfDay(d) - startOfDay(new Date())) / 86400000);
        if (diffDays === 0) return "Today";
        if (diffDays === 1) return "Tomorrow";
        if (diffDays === -1) return "Yesterday";
        return formatShortDate(d);
      }
      function agendaHeaderLabel(d) {
        const rel = relativeDateLabel(d);
        const full = formatDayHeader(d);
        return (rel === "Today" || rel === "Tomorrow" || rel === "Yesterday") ? rel + " · " + full : full;
      }
      function greeting() {
        const h = new Date().getHours();
        if (h < 12) return "Good morning";
        if (h < 18) return "Good afternoon";
        return "Good evening";
      }
      function uid() { return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }
      function eventEndKey(ev) { return ev.endDate || ev.date; }

      function buildSeedEvents() {
        const today = startOfDay(new Date());
        const k = (offset) => toKey(addDays(today, offset));
        return [
          { id: uid(), title: "Welcome to Chronova AI", date: k(0), endDate: k(0), allDay: false, startTime: "09:00", endTime: "09:30", category: "work", location: "", notes: "Tap any day or time slot to add your own event, or tap an event to edit it.", reminder: "" },
          { id: uid(), title: "Product strategy sync", date: k(0), endDate: k(0), allDay: false, startTime: "13:00", endTime: "14:00", category: "work", location: "Conference Room A", notes: "Review the Q3 roadmap.", reminder: "15" },
          { id: uid(), title: "Design review", date: k(0), endDate: k(0), allDay: false, startTime: "13:30", endTime: "14:15", category: "other", location: "", notes: "", reminder: "" },
          { id: uid(), title: "Morning run", date: k(1), endDate: k(1), allDay: false, startTime: "07:00", endTime: "07:45", category: "health", location: "Riverside Park", notes: "", reminder: "" },

          { id: uid(), title: "1:1 with manager", date: k(3), endDate: k(3), allDay: false, startTime: "13:30", endTime: "14:00", category: "work", location: "", notes: "", reminder: "5" },
          { id: uid(), title: "Yoga class", date: k(3), endDate: k(3), allDay: false, startTime: "18:30", endTime: "19:30", category: "health", location: "Studio Flow", notes: "", reminder: "30" },
          { id: uid(), title: "Flight to Austin", date: k(4), endDate: k(4), allDay: false, startTime: "08:30", endTime: "11:00", category: "travel", location: "JFK Airport", notes: "Gate opens 45 minutes before departure.", reminder: "60" },
          { id: uid(), title: "Team offsite", date: k(5), endDate: k(6), allDay: true, startTime: null, endTime: null, category: "work", location: "Lake House Retreat", notes: "Bring a laptop and comfortable shoes.", reminder: "" },
          { id: uid(), title: "Mom's birthday", date: k(9), endDate: k(9), allDay: true, startTime: null, endTime: null, category: "personal", location: "", notes: "Order flowers.", reminder: "1440" },
          { id: uid(), title: "Grocery run", date: k(-1), endDate: k(-1), allDay: false, startTime: "18:00", endTime: "18:30", category: "personal", location: "Whole Foods", notes: "", reminder: "" }
        ];
      }

      function useLocalStorage(key, initial) {
        const [value, setValue] = useState(() => {
          try {
            const raw = window.localStorage.getItem(key);
            if (raw) return JSON.parse(raw);
          } catch (err) {}
          return typeof initial === "function" ? initial() : initial;
        });
        useEffect(() => {
          try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (err) {}
        }, [key, value]);
        return [value, setValue];
      }

      function escapeICS(str) {
        return String(str || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
      }
      function icsDate(dateKey, timeStr) {
        const d = fromKey(dateKey);
        if (!timeStr) return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate());
        const parts = timeStr.split(":").map(Number);
        d.setHours(parts[0], parts[1], 0, 0);
        return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + "T" + pad2(d.getHours()) + pad2(d.getMinutes()) + "00";
      }
      function eventToVEVENT(ev) {
        const stamp = icsDate(toKey(new Date()), "00:00");
        let dtLines;
        if (ev.allDay) {
          const endExclusive = addDays(fromKey(ev.endDate || ev.date), 1);
          dtLines = "DTSTART;VALUE=DATE:" + icsDate(ev.date, null) + "\nDTEND;VALUE=DATE:" + icsDate(toKey(endExclusive), null);
        } else {
          dtLines = "DTSTART:" + icsDate(ev.date, ev.startTime || "00:00") + "\nDTEND:" + icsDate(ev.date, ev.endTime || ev.startTime || "00:00");
        }
        return [
          "BEGIN:VEVENT",
          "UID:" + ev.id + "@chronova.ortizventureholdings.com",
          "DTSTAMP:" + stamp,
          dtLines,
          "SUMMARY:" + escapeICS(ev.title),
          ev.location ? "LOCATION:" + escapeICS(ev.location) : null,
          ev.notes ? "DESCRIPTION:" + escapeICS(ev.notes) : null,
          "CATEGORIES:" + escapeICS(CATEGORY_MAP[ev.category] ? CATEGORY_MAP[ev.category].label : ev.category),
          "END:VEVENT"
        ].filter(Boolean).join("\n");
      }
      function buildICS(events) {
        return [
          "BEGIN:VCALENDAR",
          "VERSION:2.0",
          "PRODID:-//Chronova AI//Ortiz Venture Holdings LLC//EN",
          "CALSCALE:GREGORIAN",
          events.map(eventToVEVENT).join("\n"),
          "END:VCALENDAR"
        ].join("\n");
      }
      function downloadText(filename, text, mime) {
        const blob = new Blob([text], { type: mime || "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function layoutTimedEvents(events) {
        const sorted = [...events].sort((a, b) => timeToMinutes(a.startTime) - timeToMinutes(b.startTime));
        const clusters = [];
        let current = [];
        let currentEnd = -1;
        sorted.forEach(ev => {
          const start = timeToMinutes(ev.startTime);
          const end = Math.max(timeToMinutes(ev.endTime || ev.startTime), start + 15);
          if (current.length && start >= currentEnd) {
            clusters.push(current);
            current = [];
            currentEnd = -1;
          }
          current.push({ ev, start, end });
          currentEnd = Math.max(currentEnd, end);
        });
        if (current.length) clusters.push(current);

        const placed = [];
        clusters.forEach(cluster => {
          const colEnds = [];
          const withCols = cluster.map(item => {
            let col = colEnds.findIndex(end => end <= item.start);
            if (col === -1) { col = colEnds.length; colEnds.push(item.end); }
            else colEnds[col] = item.end;
            return { ...item, col };
          });
          const colCount = colEnds.length;
          withCols.forEach(item => placed.push({ ...item, colCount }));
        });
        return placed;
      }

      function MiniMonth({ anchor, todayKey, selectedKey, onSelect, onMonthShift }) {

        const monthIndex = anchor.getMonth();
        const days = useMemo(() => weeks.reduce((acc, w) => acc.concat(w), []), [weeks]);
        return (
          <div>
            <div className="mb-2 flex items-center justify-between">
              <p className="text-sm font-black text-slate-800">{formatMonthYear(anchor)}</p>
              <div className="flex gap-1">
                <button type="button" onClick={() => onMonthShift(-1)} className="grid h-6 w-6 place-items-center rounded-full text-slate-400 hover:bg-slate-100" aria-label="Previous month"><ChevronIcon dir="left" /></button>
                <button type="button" onClick={() => onMonthShift(1)} className="grid h-6 w-6 place-items-center rounded-full text-slate-400 hover:bg-slate-100" aria-label="Next month"><ChevronIcon dir="right" /></button>

            </div>
            <div className="grid grid-cols-7 text-center text-[10px] font-black text-slate-300">
              {WEEKDAY_SHORT.map(d => <span key={d}>{d[0]}</span>)}

              {days.map(day => {

                const inMonth = day.getMonth() === monthIndex;
                return (
                  <button
                    type="button"
                    key={key}
                    onClick={() => onSelect(key)}
                    className={
                      "mx-auto flex h-7 w-7 items-center justify-center rounded-full font-bold transition " +
                      (key === todayKey ? "bg-slate-950 text-white" :
                       key === selectedKey ? "bg-sky-100 text-sky-700" :
                       inMonth ? "text-slate-600 hover:bg-slate-100" : "text-slate-300 hover:bg-slate-50")

              })}

      function FiltersSheet({ open, onClose, anchor, todayKey, selectedKey, onSelectDate, onMonthShift, activeCategories, onToggleCategory, categoryCounts, onExport, onReset }) {

          <AnimatePresence>
            {open && (
              <motion.div className="absolute inset-0 z-40 flex flex-col justify-end" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}>
                <motion.div className="absolute inset-0 bg-slate-950/40" onClick={onClose} initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}></motion.div>
                <motion.div

                  <div className="mx-auto mb-3 h-1.5 w-10 rounded-full bg-slate-200"></div>

                  <button type="button" onClick={onClose} className="mt-3 w-full rounded-full bg-slate-950 py-3 text-sm font-black text-white">Done</button>
                </motion.div>
              </motion.div>
            )}
          </AnimatePresence>

      }

      function MonthView({ anchor, direction, eventsByDay, todayKey, selectedKey, onSelectDay, onEventClick, onAddForDay }) {
        const weeks = useMemo(() => getMonthMatrix(anchor), [anchor]);
        const monthIndex = anchor.getMonth();
        const days = useMemo(() => weeks.reduce((acc, w) => acc.concat(w), []), [weeks]);
        const selectedEvents = eventsByDay[selectedKey] || [];
        const selectedDate = fromKey(selectedKey);
        const selectedLabel = agendaHeaderLabel(selectedDate);

        return (
          <div>
            <AnimatePresence mode="wait">
              <motion.div
                key={anchor.getFullYear() + "-" + anchor.getMonth()}
                initial={{ opacity: 0, x: direction >= 0 ? 24 : -24 }}
                animate={{ opacity: 1, x: 0 }}
                exit={{ opacity: 0, x: direction >= 0 ? -24 : 24 }}
                transition={{ duration: .24, ease: "easeOut" }}
              >
                <div className="grid grid-cols-7 text-center text-[10px] font-black uppercase tracking-[.06em] text-slate-300">
                  {WEEKDAY_SHORT.map(d => <div key={d} className="py-1.5">{d[0]}</div>)}
                </div>
                <div className="grid grid-cols-7 gap-y-1">
                  {days.map(day => {
                    const key = toKey(day);
                    const inMonth = day.getMonth() === monthIndex;
                    const dayEvents = eventsByDay[key] || [];
                    const cats = dayEvents.reduce((acc, ev) => (acc.indexOf(ev.category) === -1 ? acc.concat(ev.category) : acc), []).slice(0, 5);
                    const isTodayCell = key === todayKey;
                    const isSelected = key === selectedKey;
                    return (
                      <button type="button" key={key} onClick={() => onSelectDay(key)} className="flex flex-col items-center gap-1 py-0.5">
                        <span className={
                          "flex h-9 w-9 items-center justify-center rounded-full text-[13px] font-bold transition " +
                          (isSelected ? "bg-slate-950 text-white" :
                           isTodayCell ? "border-2 border-slate-950 text-slate-900" :
                           inMonth ? "text-slate-700" : "text-slate-300")
                        }>{day.getDate()}</span>
                        <span className="flex h-1.5 items-center gap-0.5">
                          {cats.map(c => <span key={c} className="h-1.5 w-1.5 rounded-full" style={{ background: CATEGORY_MAP[c].swatch }}></span>)}
                        </span>
                      </button>
                    );
                  })}
                </div>
              </motion.div>
            </AnimatePresence>

            <div className="mt-4 border-t border-slate-100 pt-4">
              <p className="mb-3 text-sm font-black text-slate-800">{selectedLabel}</p>
              {selectedEvents.length === 0 ? (
                <button type="button" onClick={() => onAddForDay(selectedKey)} className="flex w-full items-center justify-center gap-2 rounded-2xl border border-dashed border-slate-200 py-6 text-sm font-bold text-slate-400">
                  <PlusIcon /> Add an event
                </button>
              ) : (
                <div className="space-y-2">
                  {selectedEvents.map(ev => (
                    <button type="button" key={ev.id} onClick={() => onEventClick(ev)} className="flex w-full items-center gap-3 rounded-xl border border-slate-100 bg-white px-3 py-2.5 text-left">
                      <span className="h-2.5 w-2.5 shrink-0 rounded-full" style={{ background: CATEGORY_MAP[ev.category].swatch }}></span>
                      <span className="w-16 shrink-0 text-xs font-bold text-slate-400">{ev.allDay ? "All day" : formatTimeLabel(ev.startTime)}</span>
                      <span className="min-w-0 flex-1 truncate text-sm font-bold text-slate-800">{ev.title}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      }

      function TimeGridView({ days, eventsByDay, todayKey, onSlotClick, onEventClick, direction, viewKey }) {
        const scrollRef = useRef(null);
        useEffect(() => {
          if (scrollRef.current) scrollRef.current.scrollTop = 6 * 64;
        }, [viewKey]);

        const now = new Date();
        const nowMinutes = now.getHours() * 60 + now.getMinutes();
        const cols = "48px repeat(" + days.length + ", minmax(88px, 1fr))";

        return (
          <AnimatePresence mode="wait">
            <motion.div
              key={viewKey}
              initial={{ opacity: 0, x: direction >= 0 ? 24 : -24 }}
              animate={{ opacity: 1, x: 0 }}
              exit={{ opacity: 0, x: direction >= 0 ? -24 : 24 }}
              transition={{ duration: .26, ease: "easeOut" }}
              className="overflow-hidden rounded-2xl border border-slate-200/70 bg-white/90"
            >
              <div className="cal-scroll overflow-x-auto">
                <div style={{ minWidth: days.length > 1 ? "620px" : "auto" }}>
                  <div className="grid border-b border-slate-200/70" style={{ gridTemplateColumns: cols }}>
                    <div></div>
                    {days.map(day => {
                      const key = toKey(day);
                      return (
                        <div key={key} className={"border-l border-slate-200/70 py-2 text-center " + (key === todayKey ? "bg-sky-50/70" : "")}>
                          <p className="text-[10px] font-black uppercase tracking-[.14em] text-slate-400">{WEEKDAY_SHORT[day.getDay()]}</p>
                          <p className={"mx-auto mt-1 flex h-7 w-7 items-center justify-center rounded-full text-sm font-black " + (key === todayKey ? "bg-slate-950 text-white" : "text-slate-700")}>{day.getDate()}</p>
                        </div>
                      );
                    })}
                  </div>
                  <div className="grid border-b border-slate-200/70" style={{ gridTemplateColumns: cols }}>
                    <div className="py-1.5 text-center text-[9px] font-black uppercase tracking-[.1em] text-slate-300">All day</div>
                    {days.map(day => {
                      const key = toKey(day);
                      const allDayEvents = (eventsByDay[key] || []).filter(ev => ev.allDay);
                      return (
                        <div key={key} className="min-h-[34px] space-y-1 border-l border-slate-200/70 p-1">
                          {allDayEvents.map(ev => (
                            <button type="button" key={ev.id} onClick={() => onEventClick(ev)} className="block w-full truncate rounded-md px-1.5 py-0.5 text-left text-[10px] font-bold" style={{ background: CATEGORY_MAP[ev.category].soft, color: CATEGORY_MAP[ev.category].text }}>{ev.title}</button>
                          ))}
                        </div>
                      );
                    })}
                  </div>
                  <div ref={scrollRef} className="cal-scroll relative max-h-[420px] overflow-y-auto">
                    <div className="grid" style={{ gridTemplateColumns: cols }}>
                      <div className="relative">
                        {HOURS.map(h => (
                          <div key={h} className="relative h-16 border-b border-slate-100">
                            <span className="absolute -top-2 right-1 text-[9px] font-bold text-slate-300">{h === 0 ? "" : minutesToTimeLabel(h * 60)}</span>
                          </div>
                        ))}
                      </div>
                      {days.map(day => {
                        const key = toKey(day);
                        const timed = (eventsByDay[key] || []).filter(ev => !ev.allDay);
                        const placed = layoutTimedEvents(timed);
                        return (
                          <div key={key} className="relative border-l border-slate-100">
                            {HOURS.map(h => (
                              <div key={h} className="h-16 border-b border-slate-100 active:bg-sky-50/60" onClick={() => onSlotClick(key, pad2(h) + ":00")}></div>
                            ))}
                            {placed.map(item => {
                              const top = (item.start / 60) * 64;
                              const height = Math.max(((item.end - item.start) / 60) * 64 - 2, 20);
                              const width = 100 / item.colCount;
                              const left = width * item.col;
                              return (
                                <button
                                  type="button"
                                  key={item.ev.id}
                                  onClick={(e) => { e.stopPropagation(); onEventClick(item.ev); }}
                                  className="absolute overflow-hidden rounded-lg px-1.5 py-1 text-left text-[11px] font-bold shadow-sm transition hover:brightness-95"
                                  style={{
                                    top: top + "px", height: height + "px",
                                    left: "calc(" + left + "% + 2px)",
                                    width: "calc(" + width + "% - 4px)",
                                    background: CATEGORY_MAP[item.ev.category].soft,
                                    color: CATEGORY_MAP[item.ev.category].text,
                                    borderLeft: "3px solid " + CATEGORY_MAP[item.ev.category].swatch
                                  }}
                                >
                                  <p className="truncate">{item.ev.title}</p>
                                  {height > 34 && <p className="truncate text-[10px] opacity-80">{formatTimeLabel(item.ev.startTime)}</p>}
                                </button>
                              );
                            })}
                            {key === todayKey && <div className="now-line" style={{ top: (nowMinutes / 60) * 64 + "px" }}></div>}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>
            </motion.div>
          </AnimatePresence>
        );
      }

      function AgendaView({ events, todayKey, onEventClick }) {
        const grouped = useMemo(() => {
          const map = {};
          events.forEach(ev => {
            if (!map[ev.date]) map[ev.date] = [];
            map[ev.date].push(ev);
          });
          return Object.keys(map).sort().map(key => ({
            key,
            date: fromKey(key),
            items: map[key].sort((a, b) => {
              if (a.allDay && !b.allDay) return -1;
              if (!a.allDay && b.allDay) return 1;
              return timeToMinutes(a.startTime) - timeToMinutes(b.startTime);
            })
          }));
        }, [events]);

        if (!grouped.length) {
          return (
            <div className="flex flex-col items-center gap-2 rounded-2xl border border-slate-100 px-6 py-16 text-center">
              <p className="text-base font-black text-slate-700">No events match your filters</p>
              <p className="text-sm text-slate-500">Try adjusting your search or category filters.</p>
            </div>
          );
        }

        return (
          <div className="space-y-4">
            {grouped.map(group => (
              <div key={group.key} className="rounded-2xl border border-slate-100 p-4">
                <p className={"mb-3 text-xs font-black uppercase tracking-[.08em] " + (group.key === todayKey ? "text-sky-600" : "text-slate-400")}>
                  {agendaHeaderLabel(group.date)}
                </p>
                <div className="space-y-2">
                  {group.items.map(ev => (
                    <button
                      type="button"
                      key={ev.id}
                      onClick={() => onEventClick(ev)}
                      className="flex w-full items-center gap-3 rounded-xl border border-slate-100 bg-white px-3 py-2.5 text-left"
                    >
                      <span className="h-2.5 w-2.5 shrink-0 rounded-full" style={{ background: CATEGORY_MAP[ev.category].swatch }}></span>
                      <span className="w-16 shrink-0 text-xs font-bold text-slate-400">{ev.allDay ? "All day" : formatTimeLabel(ev.startTime)}</span>
                      <span className="min-w-0 flex-1 truncate text-sm font-bold text-slate-800">{ev.title}</span>
                    </button>
                  ))}
                </div>
              </div>
            ))}
          </div>
        );
      }

      function EventModal({ draft, onChange, onClose, onSave, onDelete }) {
        const isEdit = !!draft.id;
        const titleRef = useRef(null);
        useEffect(() => { if (titleRef.current) titleRef.current.focus(); }, []);

        function set(field, value) { onChange({ ...draft, [field]: value }); }
        function handleSubmit(e) { e.preventDefault(); onSave(draft); }

        return (
          <motion.div
            className="absolute inset-0 z-40 flex items-center justify-center bg-slate-950/40 p-4 backdrop-blur-sm"
            initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
            onClick={onClose}
          >
            <motion.form
              onSubmit={handleSubmit}
              onClick={(e) => e.stopPropagation()}
              initial={{ opacity: 0, scale: .95, y: 12 }} animate={{ opacity: 1, scale: 1, y: 0 }} exit={{ opacity: 0, scale: .96, y: 8 }}
              transition={{ duration: .22, ease: "easeOut" }}
              className="cal-scroll liquid-glass-strong max-h-[85%] w-full overflow-y-auto rounded-[26px] p-5"

              <input

              <div className="mt-3 flex items-center justify-between rounded-xl bg-slate-50 px-3.5 py-2.5">
                <span className="text-sm font-bold text-slate-600">All day</span>
                <button
                  type="button"
                  onClick={() => set("allDay", !draft.allDay)}

                  </label>
                ) : (
                  <div className="grid grid-cols-2 gap-2">

                    <label className="block">
                      <span className="mb-1 block text-xs font-black uppercase tracking-[.1em] text-slate-400">End</span>
                      <input type="time" value={draft.endTime || "10:00"} onChange={(e) => set("endTime", e.target.value)} className="w-full rounded-xl border border-slate-200 bg-white px-2 py-2 text-sm font-bold text-slate-700 outline-none focus:border-sky-400" />
                    </label>
                  </div>

              <div className="mt-3">

                  {CATEGORIES.map(cat => {
                    const active = draft.category === cat.id;

                      <button

                        key={cat.id}
                        onClick={() => set("category", cat.id)}
                        className={"flex items-center gap-1.5 rounded-full border px-3 py-1.5 text-xs font-black transition " + (active ? "border-transparent text-white" : "border-slate-200 text-slate-500 hover:border-slate-300")}

              <p className="text-base font-black text-slate-900">Delete this event?</p>

              <div className="mt-5 flex items-center justify-center gap-2">
                <button type="button" onClick={onCancel} className="rounded-full px-4 py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-100">Cancel</button>
                <button type="button" onClick={onConfirm} className="rounded-full bg-rose-500 px-5 py-2.5 text-sm font-black text-white hover:bg-rose-600">Delete</button>
              </div>
            </motion.div>
          </motion.div>
        );
      }

      function ToastStack({ toasts }) {
        return (
          <div className="pointer-events-none absolute inset-x-4 z-[45] flex flex-col gap-2" style={{ bottom: "calc(5.5rem + env(safe-area-inset-bottom))" }}>
            <AnimatePresence>
              {toasts.map(t => (
                <motion.div
                  key={t.id}
                  initial={{ opacity: 0, y: 16, scale: .96 }}
                  animate={{ opacity: 1, y: 0, scale: 1 }}
                  exit={{ opacity: 0, y: 8, scale: .96 }}
                  className="liquid-glass-strong pointer-events-auto flex items-center gap-2 rounded-2xl px-4 py-3 text-sm font-bold text-slate-800"
                >
                  {t.tone === "reminder" ? <BellIcon /> : <CheckIcon />}
                  {t.message}
                </motion.div>
              ))}
            </AnimatePresence>
          </div>
        );
      }

      function FAB({ onClick }) {
        return (
          <motion.button
            type="button"
            onClick={onClick}
            whileTap={{ scale: .92 }}
            className="absolute right-5 z-30 grid h-14 w-14 place-items-center rounded-full bg-slate-950 text-white shadow-xl shadow-sky-900/25"
            style={{ bottom: "calc(1.5rem + env(safe-area-inset-bottom))" }}
            aria-label="New event"
          >
            <svg viewBox="0 0 24 24" className="h-6 w-6" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" /></svg>
          </motion.button>
        );
      }

      function Header({ periodLabel, onPrev, onNext, onToday, onOpenFilters, searchOpen, setSearchOpen, search, setSearch, searchInputRef }) {
        return (
          <div className="border-b border-slate-100">
            <div className="flex h-12 items-center gap-2 px-4">
              <a href="/" className="flex min-w-0 items-center gap-2" aria-label="Ortiz Venture Holdings home">
                <BrandMark />
                <span className="truncate text-sm font-black text-slate-950">Chronova <span className="font-luxury text-sky-600">AI</span></span>
              </a>
              <div className="ml-auto flex shrink-0 items-center gap-1">
                <button type="button" onClick={() => setSearchOpen(v => !v)} className="grid h-9 w-9 place-items-center rounded-full text-slate-500 hover:bg-slate-100" aria-label="Search">
                  <svg viewBox="0 0 24 24" className="h-[18px] w-[18px]" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" strokeWidth="2.2" /><path d="M21 21l-4-4" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" /></svg>
                </button>
                <button type="button" onClick={onOpenFilters} className="grid h-9 w-9 place-items-center rounded-full text-slate-500 hover:bg-slate-100" aria-label="Filters and date"><FilterIcon /></button>
              </div>
            </div>

            {searchOpen ? (
              <div className="flex h-12 items-center gap-2 px-4">
                <div className="flex flex-1 items-center gap-2 rounded-full border border-slate-200 bg-slate-50 px-3 py-2">
                  <SearchIcon />
                  <input ref={searchInputRef} value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search events…" className="w-full min-w-0 bg-transparent text-sm font-semibold text-slate-700 outline-none placeholder:text-slate-300" />
                </div>
                <button type="button" onClick={() => { setSearchOpen(false); setSearch(""); }} className="shrink-0 text-sm font-bold text-sky-600">Cancel</button>
              </div>
            ) : (
              <div className="flex h-12 items-center gap-1 px-2">
                <button type="button" onClick={onPrev} className="grid h-9 w-9 shrink-0 place-items-center rounded-full text-slate-400 hover:bg-slate-100" aria-label="Previous"><ChevronIcon dir="left" /></button>
                <button type="button" onClick={onOpenFilters} className="min-w-0 flex-1 truncate text-center text-[15px] font-black text-slate-900">{periodLabel}</button>
                <button type="button" onClick={onNext} className="grid h-9 w-9 shrink-0 place-items-center rounded-full text-slate-400 hover:bg-slate-100" aria-label="Next"><ChevronIcon dir="right" /></button>
                <button type="button" onClick={onToday} className="ml-1 shrink-0 rounded-full border border-slate-200 px-3 py-1.5 text-xs font-bold text-slate-600 hover:border-slate-300">Today</button>
              </div>
            )}
          </div>
        );
      }

      function ViewTabs({ view, setView }) {
        const VIEWS = [["month", "Month"], ["week", "Week"], ["day", "Day"], ["agenda", "Agenda"]];
        return (
          <div className="grid grid-cols-4 gap-1.5 border-b border-slate-100 px-3 py-2">
            {VIEWS.map(([id, label]) => (
              <button
                key={id}
                type="button"
                onClick={() => setView(id)}
                className={"rounded-full py-1.5 text-[11px] font-black uppercase tracking-[.04em] transition " + (view === id ? "bg-slate-950 text-white" : "bg-slate-100 text-slate-400")}
              >{label}</button>
            ))}
          </div>
        );
      }

      function App() {
        const [events, setEvents] = useLocalStorage(STORAGE_KEYS.events, buildSeedEvents);
        const [remindedIds, setRemindedIds] = useLocalStorage(STORAGE_KEYS.reminded, []);
        const [view, setView] = useState("month");
        const [anchor, setAnchor] = useState(() => startOfDay(new Date()));
        const [direction, setDirection] = useState(1);
        const [selectedDayKey, setSelectedDayKey] = useState(() => toKey(new Date()));
        const [modal, setModal] = useState(null);
        const [confirmDeleteId, setConfirmDeleteId] = useState(null);
        const [search, setSearch] = useState("");
        const [searchOpen, setSearchOpen] = useState(false);
        const [activeCategories, setActiveCategories] = useState(() => CATEGORIES.map(c => c.id));
        const [filtersOpen, setFiltersOpen] = useState(false);
        const [toasts, setToasts] = useState([]);
        const searchInputRef = useRef(null);
        const todayKey = toKey(new Date());

        const pushToast = useCallback((message, tone) => {
          const id = uid();
          setToasts(t => [...t, { id, message, tone: tone || "default" }]);
          setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3800);
        }, []);

        const visibleEvents = useMemo(() => {
          const q = search.trim().toLowerCase();
          return events.filter(ev => {
            if (activeCategories.indexOf(ev.category) === -1) return false;
            if (!q) return true;
            return (ev.title || "").toLowerCase().indexOf(q) !== -1 ||
                   (ev.location || "").toLowerCase().indexOf(q) !== -1 ||
                   (ev.notes || "").toLowerCase().indexOf(q) !== -1;
          });
        }, [events, activeCategories, search]);

        const eventsByDay = useMemo(() => {
          const map = {};
          visibleEvents.forEach(ev => {
            const start = fromKey(ev.date);
            const end = fromKey(eventEndKey(ev));
            let cursor = new Date(start);
            let guard = 0;
            while (cursor <= end && guard < 60) {
              const key = toKey(cursor);
              if (!map[key]) map[key] = [];
              map[key].push(ev);
              cursor = addDays(cursor, 1);
              guard++;
            }
          });
          Object.keys(map).forEach(key => {
            map[key].sort((a, b) => {
              if (a.allDay && !b.allDay) return -1;
              if (!a.allDay && b.allDay) return 1;
              return timeToMinutes(a.startTime) - timeToMinutes(b.startTime);
            });
          });
          return map;
        }, [visibleEvents]);

        const categoryCounts = useMemo(() => {
          const counts = {};
          CATEGORIES.forEach(c => counts[c.id] = 0);
          events.forEach(ev => { counts[ev.category] = (counts[ev.category] || 0) + 1; });
          return counts;
        }, [events]);

        function navigate(step) {
          setDirection(step);
          setAnchor(prev => {
            if (view === "month") return addMonths(prev, step);
            if (view === "week") return addDays(prev, 7 * step);
            if (view === "day") return addDays(prev, step);
            return addMonths(prev, step);
          });
        }
        function goToday() {
          setDirection(0);
          const t = startOfDay(new Date());
          setAnchor(t);
          setSelectedDayKey(toKey(t));
        }
        function selectDay(key) {
          setSelectedDayKey(key);
          const d = fromKey(key);
          if (d.getMonth() !== anchor.getMonth() || d.getFullYear() !== anchor.getFullYear()) {
            setAnchor(startOfDay(d));
          }
        }

        function openCreate(dateKey, startTime) {
          const st = startTime || "09:00";
          setModal({
            mode: "create",
            draft: {
              id: null,
              title: "",
              date: dateKey || selectedDayKey,
              endDate: dateKey || selectedDayKey,
              allDay: false,
              startTime: st,
              endTime: minutesToTimeStr(timeToMinutes(st) + 60),
              category: "work",
              location: "",
              notes: "",
              reminder: ""
            }
          });
        }
        function openEdit(ev) { setModal({ mode: "edit", draft: { ...ev } }); }
        function closeModal() { setModal(null); }

        function saveEvent(draft) {
          if (!draft.title.trim()) return;
          const endDate = draft.allDay ? (draft.endDate && draft.endDate >= draft.date ? draft.endDate : draft.date) : draft.date;
          const startTime = draft.allDay ? null : (draft.startTime || "09:00");
          let endTime = draft.allDay ? null : (draft.endTime || "10:00");
          if (!draft.allDay && timeToMinutes(endTime) <= timeToMinutes(startTime)) {
            endTime = minutesToTimeStr(timeToMinutes(startTime) + 30);
          }
          const clean = { ...draft, title: draft.title.trim(), endDate, startTime, endTime };
          if (draft.id) {
            setEvents(list => list.map(e => e.id === draft.id ? { ...clean, id: draft.id } : e));
            pushToast("Event updated");
          } else {
            setEvents(list => [...list, { ...clean, id: uid() }]);
            pushToast("Event created");
          }
          setModal(null);
        }
        function requestDelete(id) { setConfirmDeleteId(id); }
        function confirmDelete() {
          setEvents(list => list.filter(e => e.id !== confirmDeleteId));
          setConfirmDeleteId(null);
          setModal(null);
          pushToast("Event deleted");
        }
        function toggleCategory(id) {
          setActiveCategories(list => list.indexOf(id) === -1 ? [...list, id] : list.filter(x => x !== id));
        }
        function resetDemo() {
          setEvents(buildSeedEvents());
          setRemindedIds([]);
          pushToast("Demo calendar reset");
        }
        function exportAll() {
          if (!events.length) { pushToast("No events to export"); return; }
          downloadText("chronova-calendar.ics", buildICS(events), "text/calendar");
          pushToast("Calendar exported");
        }
        function handlePickDate(key) {
          selectDay(key);
          setFiltersOpen(false);
        }

        useEffect(() => {
          function check() {
            const now = new Date();
            events.forEach(ev => {
              if (ev.reminder === "" || ev.reminder == null || ev.allDay) return;
              const target = fromKey(ev.date);
              const parts = (ev.startTime || "00:00").split(":").map(Number);
              target.setHours(parts[0], parts[1], 0, 0);
              target.setMinutes(target.getMinutes() - Number(ev.reminder));
              const diff = now - target;
              const fireKey = ev.id + ":" + target.getTime();
              if (diff >= 0 && diff < 20000 && remindedIds.indexOf(fireKey) === -1) {
                pushToast("Reminder: " + ev.title + " at " + formatTimeLabel(ev.startTime), "reminder");
                setRemindedIds(list => [...list.slice(-200), fireKey]);
              }
            });
          }
          const interval = setInterval(check, 15000);
          return () => clearInterval(interval);
        }, [events, remindedIds, pushToast, setRemindedIds]);

        useEffect(() => {
          if (searchOpen && searchInputRef.current) searchInputRef.current.focus();
        }, [searchOpen]);

        useEffect(() => {
          function onKeyDown(e) {
            const tag = (e.target.tagName || "").toLowerCase();
            if (tag === "input" || tag === "textarea" || tag === "select") {
              if (e.key === "Escape") e.target.blur();
              return;
            }
            if (modal || confirmDeleteId || filtersOpen) {
              if (e.key === "Escape") { setModal(null); setConfirmDeleteId(null); setFiltersOpen(false); }
              return;
            }
            if (e.key === "Escape" && searchOpen) { setSearchOpen(false); setSearch(""); return; }
            if (e.key === "t" || e.key === "T") goToday();
            else if (e.key === "n" || e.key === "N") openCreate(selectedDayKey);
            else if (e.key === "ArrowLeft") navigate(-1);
            else if (e.key === "ArrowRight") navigate(1);
            else if (e.key === "/") { e.preventDefault(); setSearchOpen(true); }
            else if (e.key === "1") setView("month");
            else if (e.key === "2") setView("week");
            else if (e.key === "3") setView("day");
            else if (e.key === "4") setView("agenda");
          }
          document.addEventListener("keydown", onKeyDown);
          return () => document.removeEventListener("keydown", onKeyDown);
        }, [modal, confirmDeleteId, filtersOpen, searchOpen, anchor, view, selectedDayKey]);

        function periodLabel() {
          if (view === "month") return formatMonthYear(anchor);
          if (view === "week") {
            const days = getWeekDays(anchor);
            const start = days[0], end = days[6];
            if (start.getMonth() === end.getMonth()) return MONTH_LONG[start.getMonth()] + " " + start.getDate() + "–" + end.getDate() + ", " + end.getFullYear();
            return formatShortDate(start) + " – " + formatShortDate(end) + ", " + end.getFullYear();
          }
          if (view === "day") return formatDayHeader(anchor);
          return "Agenda";
        }

        return (
          <div className="phone-stage">
            <div className="phone-body">
              <div className="phone-notch"></div>

              <div className="phone-screen cal-scroll">
                <div className="sticky top-0 z-30 shrink-0 bg-white/95 backdrop-blur-xl" style={{ paddingTop: "env(safe-area-inset-top)" }}>
                  <Header
                    periodLabel={periodLabel()} onPrev={() => navigate(-1)} onNext={() => navigate(1)} onToday={goToday}
                    onOpenFilters={() => setFiltersOpen(true)}
                    searchOpen={searchOpen} setSearchOpen={setSearchOpen}
                    search={search} setSearch={setSearch} searchInputRef={searchInputRef}
                  />
                  <ViewTabs view={view} setView={setView} />
                </div>

                <main className="flex-1 px-4 pb-24 pt-3">
                  <AnimatePresence mode="wait">
                    <motion.div key={view} initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} transition={{ duration: .16 }}>
                      {view === "month" && (
                        <MonthView
                          anchor={anchor} direction={direction} eventsByDay={eventsByDay} todayKey={todayKey}
                          selectedKey={selectedDayKey} onSelectDay={selectDay}
                          onEventClick={openEdit} onAddForDay={(key) => openCreate(key)}
                        />
                      )}
                      {view === "week" && (
                        <TimeGridView days={getWeekDays(anchor)} eventsByDay={eventsByDay} todayKey={todayKey} onSlotClick={(key, time) => openCreate(key, time)} onEventClick={openEdit} direction={direction} viewKey={"week-" + toKey(anchor)} />
                      )}
                      {view === "day" && (
                        <TimeGridView days={[anchor]} eventsByDay={eventsByDay} todayKey={todayKey} onSlotClick={(key, time) => openCreate(key, time)} onEventClick={openEdit} direction={direction} viewKey={"day-" + toKey(anchor)} />
                      )}
                      {view === "agenda" && (
                        <AgendaView events={visibleEvents} todayKey={todayKey} onEventClick={openEdit} />
                      )}
                    </motion.div>
                  </AnimatePresence>
                </main>
              </div>

              <FAB onClick={() => openCreate(selectedDayKey)} />
              <div className="phone-home-indicator"></div>

              <FiltersSheet
                open={filtersOpen} onClose={() => setFiltersOpen(false)}
                anchor={anchor} todayKey={todayKey} selectedKey={selectedDayKey}
                onSelectDate={handlePickDate}
                onMonthShift={(step) => setAnchor(a => addMonths(a, step))}
                activeCategories={activeCategories} onToggleCategory={toggleCategory} categoryCounts={categoryCounts}
                onExport={exportAll} onReset={resetDemo}
              />

              <AnimatePresence>
                {modal && (
                  <EventModal
                    draft={modal.draft}
                    onChange={(next) => setModal({ ...modal, draft: next })}
                    onClose={closeModal}
                    onSave={saveEvent}
                    onDelete={requestDelete}
                  />
                )}
              </AnimatePresence>

              <AnimatePresence>
                {confirmDeleteId && <ConfirmDialog onCancel={() => setConfirmDeleteId(null)} onConfirm={confirmDelete} />}
              </AnimatePresence>

              <ToastStack toasts={toasts} />
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
