name: PropertyPilot AI app CI

on:
  push:
    branches: [main]
    paths:
      - "propertypilot-ai-app/**"
      - ".github/workflows/propertypilot-ai-app-ci.yml"
  pull_request:
    paths:
      - "propertypilot-ai-app/**"
      - ".github/workflows/propertypilot-ai-app-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: propertypilot-ai-app
    env:
      # Ephemeral CI-only sqlite db and a throwaway secret — nothing sensitive,
      # nothing that persists past the job. Real deployments must set their own.
      DATABASE_URL: "file:./dev.db"
      SESSION_SECRET: "ci-placeholder-secret-not-used-in-production"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: propertypilot-ai-app/package-lock.json
      - run: npm ci
      - run: npm run db:push
      - run: npm run build
